author: DuLL-FoX
delete-after: true
changes:
  - code_imp: 'Отключение игрока больше не морозит сервер: клиента перестали держать
      ховер мыши, чат-очередь, список погибших, закрытые тикеты, ментор-данные, plug13,
      татуировки, радиальные меню и запросы.'
  - code_imp: Ответ на тикет ахелпа или ментор-тикет находит автора по ckey, если
      тот переподключился.
  - code_imp: Консоль навигации шаттла пересчитывает посадочное место один раз за
      нажатие.
  - code_imp: Пересечение посадочного места с доками считается по границам, без строковых
      списков координат.
  - code_imp: Визуал космического ветра переиспользуется турфом вместо пересоздания
      каждые две секунды.
  - code_imp: Ивент Grid Check проверяет критичные машины через список машин, а не
      обходом зоны на каждом APC.
  - code_imp: Миграция мышей ищет открытые провода по списку кабелей, а не по всей
      станции.
  - code_imp: Удаление призраков и записей датакора стало дешевле.
  - code_imp: Глаз ИИ подсвечивает камеры рядом по чанкам камерасети.
  - bugfix: Костюмы МОД Центрального Командования снова огнеупорны и не проводят ток.
