author: DuLL-FoX
delete-after: true
changes:
  - image: 'Космос за иллюминатором больше не выглядит одинаково каждый раунд: добавлен
      каталог профилей параллакса - дальний космос, секторные туманности, орбиты лавового,
      плазменного и мёртвого миров, процедурно собранная планета, астероидный пояс.'
  - image: 'На планетарных уровнях появилась своя погода: метель на ледяных, пепел
      на лавовых, пыльная буря на прочих. Небо газового гиганта - отдельный профиль.'
  - image: Добавлен фон "до параллакса" из старого SS13 и калибровочная мишень для
      отладки.
  - image: Пепельные бури, метели, бури пустоты и радиационные штормы теперь меняют
      вид за бортом, пока идут.
  - rscadd: 'Добавлены события космической погоды: кладбище кораблей, поле микрообломков,
      блюспейс-шторм, ионная буря, блюспейс-интерфаза и фотонный вихрь. Каждое идёт
      фазами - подход, пик и уход, - и фазу видно прямо в иллюминаторе.'
  - rscadd: Кладбище кораблей выносит к станции разбираемые обломки, часть из них
      идёт на столкновение с корпусом.
  - rscadd: Поле микрообломков точит внешнее остекление и скафандры снаружи, но оставляет
      на корпусе наросты, которые можно соскрести на материалы.
  - rscadd: Ионная буря кратно поднимает выработку солнечных панелей и бьёт скачком
      по секциям, где накопители были заполнены.
  - rscadd: Блюспейс-шторм расшатывает точность телепортации и разбрасывает вещи проколами,
      а блюспейс-интерфаза глушит блюспейс целиком и задерживает шаттл.
  - rscadd: Фотонный вихрь трясёт станцию приливными волнами, простреливает внешний
      контур излучением и оставляет снаружи сжатую материю.
  - rscadd: Добавлен астрометрический сенсор - машина из протолата, которую ставят
      у иллюминатора и наводят на явление за бортом. Показывает фазу и время до пика,
      а собранные данные идут в исследования. Чем выше усиление, тем больше данных
      и тем быстрее выгорает приёмник.
  - balance: 'Явления космической погоды больше не флейвор за ноль: у них появились
      ступени директора, цены и общее семейство анти-повторов.'
  - qol: Скайбоксы больше не показывают край картинки при нестандартном размере окна.
  - code_imp: 'Параллакс переведён на профили: слои умеют тайлиться любым размером,
      а не только 480, появились режимы скайбокса, статического объекта и экранной
      тонировки.'
  - code_imp: Событиям добавлен стек модификаторов параллакса со снятием по токену
      - два наложившихся события больше не сбрасывают изменения друг друга.
  - admin: Добавлены Set Parallax Profile и Show Parallax State в Debug.
  - bugfix: Планета больше не висит неподвижно за окном летящего шаттла и не появляется
      в гиперпространстве.
  - bugfix: Крупные объекты параллакса уезжают за край, когда сцена под ними прокручивается.
  - bugfix: Вход на турф гиперпространства перестал сыпать рантаймами, когда пришедшего
      удалили тем же тиком.
  - tweak: Станция теперь всегда висит над одним и тем же лавовым миром - он помечает
      её сектор. Всё разнообразие фонов уехало в остальной космос, на руины, в ЦК
      и в полёт.
  - rscadd: "Культ меняет вид из иллюминатора: небо багровеет, когда культ разрастается,\
      \ и заливается кровью, когда он берёт станцию. Призыв Нар'Си видно за бортом."
  - rscadd: 'Вознесение еретика меняет небо по пути: пепел даёт оранжевое зарево,
      ржавчина - рыжий налёт, пустота - холодную синеву, плоть - густой багрянец.'
  - tweak: Космические явления, приходящие в сектор станции, больше не стирают планету
      с неба.
