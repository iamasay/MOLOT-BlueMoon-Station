author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Мобы, убитые внутри поля таймстопа, больше не встают трупами после его
      снятия
  - bugfix: Труп моба больше не может стать невидимым из-за отсутствующего или ошибочного
      спрайта смерти; починены культисты, паучиха-штурмовик, гончая ада, гоном и фанклоу
  - bugfix: Эклектусы и желтоголовый королёк больше не пропадают, когда садятся на
      жёрдочку
  - bugfix: Мёртвый взрослый слайм больше не невидим, а воскрешённый рисуется своим
      цветом и размером
  - bugfix: Сырный зомби наконец выглядит сырным зомби и не роняет труп медика поверх
      собственных гибов
  - bugfix: Хлебная опухоль снова оповещает призраков о своём появлении и умеет лазить
      по вентиляции
