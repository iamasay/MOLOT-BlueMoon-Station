author: Herobrine998
delete-after: true
changes:
  - rscadd: Для BYOND инпут вербов (Say, whisper, me и т.д.) добавлены вербы обертки
      с параметрами. Это позволит открывать сразу несколько окон ввода, в отличие
      от обычного input(). Это касается только команд без индикатора и только при
      вызове через горячие клавиши. По кнопке в панельке такого эффекта не выйдет
  - rscadd: Шепот теперь будет накидывать больше звездочек в сообщение при подслушивании
  - rscdel: Вырезан Subtle, т.к. имеется Subtler, а функцию они выполняют одинаковую
  - rscdel: Куча лишних файлов удалены, код перенесен в основные файлы
  - qol: В 2 раза повышен лимит сообщений
  - bugfix: Пофикшены некоторые баги при установки горячих клавиш
  - bugfix: Пофикшена возможность выбрать самого себя в Таргетном субтайтлере
