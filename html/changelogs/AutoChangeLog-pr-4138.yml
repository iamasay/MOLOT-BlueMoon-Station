author: DuLL-FoX
delete-after: true
changes:
  - rscadd: '20 новых малых событий: капсула бедствия, списанный спутник, дрон шахтёров,
      туристы, утечка радиации, сбой гравитации, глючный бот, патч прошивки киборгов,
      инвентаризация, анкета ЦК, отзыв ID-карт, перехват контрабанды, корпоратив,
      дегустация, неспокойный дух, редкая рукопись, этапированный заключённый, беглые
      обезьяны, санинспекция медбея, потерянный питомец.'
  - rscadd: HK-47 - дроид-ассасин, мидраунд-антагонист с контрактами, модулями и розыском
      при свидетелях. Экипаж может обездвижить и перепрошить его.
  - rscadd: 'Заброшенная фабрика HK-50 в космосе: засада, конвейер, трофеи.'
  - rscadd: HK-51 - дроид экипажа, собирается из пяти частей с руин и чёрного рынка.
  - imageadd: Спрайты событий, шасси HK, фабрики и частей HK-51.
  - soundadd: Звуки событий и голос дроидов HK.
  - bugfix: Попадание снаряда теперь замечают враждебные NPC, маскировочные модули
      MOD, маскировка борга-диверсанта и слуги HK-50.
  - bugfix: Хранилище на Трамстанции снова запитано.
  - bugfix: Чёрные списки руин работают на Linux-сервере.
