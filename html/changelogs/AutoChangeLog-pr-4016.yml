author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Трава (обычная, светящаяся, ковровая) снова созревает в лотках после другого
      растения.
  - bugfix: При разрушении мусорной трубы наружу выпадают все, кто в ней был, а не
      только первый.
  - bugfix: Портативная помпа снова качает газ сразу, без задержки до двух минут.
  - bugfix: 'Коллектор радиации экранирует свой баллон: газ внутри больше не превращается
      в плюоксиум от облучения.'
  - bugfix: Из меню крафта убран сломанный пункт «stack recipe», который вешал крафт
      до конца раунда.
  - bugfix: Клинботы убирают обрывки упаковки.
  - bugfix: Пираты и другие гостроли с корабля больше не спавнятся лишним телом в
      закрытой комнате ЦК.
  - bugfix: Синдикатские атмос-техники получают синдикатскую сумку.
  - bugfix: Сборку с ИК-эмиттером можно поворачивать Alt+кликом, луч поворачивается
      вместе с ней.
  - bugfix: Alt+клик борга снова электризует шлюзы и переключает турели.
  - bugfix: После закрытия крыльев персонаж перестаёт парить.
  - bugfix: Нимфа дионы при росте сохраняет предметы в руках.
  - bugfix: Благодарность в конце раунда работает для имён на кириллице.
  - bugfix: Камера возвращается на место после опьянения.
  - bugfix: Спина БДР-01 больше не торчит из одежды в профиль.
  - bugfix: ИИ-свармеры не набиваются толпой в одну клетку рядом с целью.
  - bugfix: Мегафауна не гонится за отрубленной головой и атакует мех своего обидчика.
  - bugfix: Картинки персонажей с хостов с защитой от хотлинков снова отображаются.
  - balance: 'Скорость мобов под ИИ подстроена под новый бег игрока: боссы, которые
      раньше шли вровень с бегущим игроком, снова идут вровень, а не обгоняют его;
      обычная фауна снова медленнее игрока в прежней пропорции.'
