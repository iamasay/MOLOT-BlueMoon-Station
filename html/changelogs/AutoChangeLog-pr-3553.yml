author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Пилот мехи больше не глохнет и слышит всё вокруг, а не только тот кусок
      станции, где он в меха сел
  - bugfix: Кнопка печати в консоли связи снова работает больше одного раза
  - bugfix: 'Префы антагонистов сохраняются правильно: приоритет не плодит дубли,
      а выключение действительно выключает роль'
  - bugfix: Репродуктивные экстракты снова можно кормить кубиками мартышек прямо из
      био-мешка
  - bugfix: Шлем биозащиты РнД больше не показывает мордатым расам лысую человеческую
      голову
  - bugfix: Борг больше не пропадает с экрана, выбрав позу отдыха, которой нет у его
      шасси
  - bugfix: Flashdark наконец делает пузырь темноты вокруг носителя, а не конус вперёд
  - qol: При попадании из пульверизатора жертве пишут об этом в чат, а само попадание
      попадает в админ-логи
  - bugfix: Пульверизатор, пшикнувший в пустоту, больше не сыплет ошибками в лог
  - bugfix: Сильвер-сульфадиазин и стиптик, которыми облили, снова лечат
  - bugfix: Панель выбора экипировки больше не падает на предпросмотре набора InteQ
  - bugfix: Имплант нанитного насоса перестал сыпать ошибками в лог
  - bugfix: Предмет, удалённый прямо в руках, больше не пытается переехать на пол
  - bugfix: Речь и шёпот больше не ломаются, если персонаж исчез, пока было открыто
      окно ввода
  - bugfix: Окно интерфейса, закрытое во время обновления, больше не роняет ошибку
      и не показывает чужие данные
  - bugfix: Верб навигации, запущенный дважды подряд, больше не дублирует маршрут
      на экране
  - bugfix: Гост-роли западного и восточного эшвокера снова можно занять из лобби
  - bugfix: Вход в раунд больше не отбивается первые секунды после старта, а админам
      не летят ложные сообщения о читерстве
  - bugfix: Кнопка лобби больше не отказывается работать у игроков с неполной записью
      настроек в сейве
  - bugfix: Кукла в редакторе персонажа больше не растёт с каждым кликом и не превращается
      в серое пятно
  - bugfix: Замедление от стаггера и потери равновесия снова работает - настройки
      с дробным значением больше не обнуляются при загрузке
  - bugfix: Радиационный импульс снова слабеет с расстоянием, а не бьёт на всю дистанцию
      одинаково
  - bugfix: Турель, которой некуда стрелять, больше не палит в собственную стену бесконечно
  - bugfix: Кислота, вылитая в воду, наконец расходует содержимое ёмкости
  - bugfix: Автоматическое крио снова находит консоль экипажа на любой карте
  - server: 'Логи чище: пропали 4217 строк ложных эмоутов и 456 строк ложных предупреждений
      конфига за смену, а лог пульверизатора наконец пишет, чем пшикнули'
  - bugfix: Зомби и големы больше не создают фантомных видов, а админский выбор вида
      не роняет ошибку
  - bugfix: Големам наконец применяется операция без боли - как и было задумано модульным
      патчем
  - bugfix: Устройство Самоактуализации больше не лечит бесплатно весь физический
      и термический урон и не запирает пациента при отказе процедуры
  - bugfix: Настенная турель больше не стреляет из космоса сквозь стену по цели, в
      которую не может попасть
  - balance: Событие "Aphrodisiac Flood" делает облака дыма вдвое меньше и больше
      не заваливает админов сотнями сообщений
  - bugfix: Миграция карпов больше не подвешивает сервер на треть секунды
  - bugfix: Ресайклер больше не ошибается на бумажном самолётике
  - bugfix: Игрок в VR-капсуле больше не засоряет лог сервера каждые восемь секунд
  - bugfix: Подпись на бумаге понимается в любом регистре, %date работает наравне
      с %data, а писать на бумаге может не только человек
  - bugfix: Факс пишет в лог ключ игрока, а не только имя персонажа
  - bugfix: Битая строка списка кастомных предметов больше не портит сам список
  - bugfix: Проверка смещения APC на восток и запад больше не сравнивает не те оси
  - server: Обезьяны в жизненном цикле используют кэшированную проверку игроков рядом
  - code_imp: Лог реагентов переведён под конфиг-флаг LOG_REAGENTS - полтора мегабайта
      отладочных строк за раунд по умолчанию больше не пишутся
  - bugfix: Взрыв "кислота в воду" больше не создаёт реагент из ниоткуда и не плодит
      вложенные облака дыма
  - bugfix: Попадание облака спрея больше не роняет ошибку, если стрелявшего уже удалили
  - bugfix: Русские подсказки в вербе навигации вместо английских
  - bugfix: Раздавливание головы больше не роняет ошибку на партнёре без клиента,
      а жёсткий вариант требует явного согласия обоих
  - bugfix: Стрип-меню больше не пытается вложить в руки предмет, который сам себя
      удалил при снятии
  - bugfix: Выбор размера тела больше не крашится у персонажей, чей размер выше текущего
      максимума
  - bugfix: Апгрейд самопочинки борга больше не роняет ошибку при снятии без активации
  - bugfix: Схемы интегральных сборок больше не упираются в лимит передачи на пяти
      тысячах символов, а отказ передачи больше не выглядит зависшим окном
  - bugfix: Код схемы из анализатора и ghost scan больше не портится символами < >
      & при копировании
  - bugfix: Длинный текст в окнах ввода передаётся почти вдвое меньшим числом запросов
  - bugfix: Карпы и другие стайные хищники снова преследуют жертву и атакуют, а не
      стоят рядом
  - bugfix: Копии мимиков и анимированные предметы тоже снова преследуют цель
  - code_imp: Сервер пишет в лог, какие настройки конфига расходятся с заложенными
      в коде - чтобы отставший прод-конфиг было видно сразу
