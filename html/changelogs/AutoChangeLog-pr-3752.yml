author: Semonic61
delete-after: true
changes:
  - rscadd: 'Добавлены новые блюда с креветками: пицца с креветками и её кусок, суши
      Ebi Hosomaki, онигири, булочка с креветкой, шашлык с креветками и суп с креветками.'
  - rscadd: Креветки теперь можно синтезировать в биогенераторе. Рецепт появляется
      в списке только после установки фемто-манипулятора (T4).
  - rscadd: Упаковку креветок теперь можно найти в холодильнике с яйцами, молоком,
      и т.д., помимо заказа с ЦК.
  - rscadd: После вскрытия упаковки под ногами остаётся смятая плёнка.
  - rscadd: Добавлены плюшевые игрушки Gizi и Ariral. По альт-клику переключаются
      между обычной и мини-версией.
  - qol: 'Название и описание лотка с креветками теперь меняются по состоянию: запечатанная
      упаковка, вскрытый лоток с креветками и пустой лоток.'
  - sound: Плюшевые Gizi и Ariral издают звук при использовании.
  - image: Добавлены спрайты новых блюд с креветками и плюшевых игрушек.
  - code_imp: 'Небольшая чистка кода упаковки креветок: переименована переменная компонента
      хранилища, громкость звука вынесена в дефайн.'
