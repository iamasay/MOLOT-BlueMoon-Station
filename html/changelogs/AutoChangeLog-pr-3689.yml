author: FinkRLD
delete-after: true
changes:
  - rscadd: Добавлены флаги отображения всплывающих эффектов
  - rscadd: Добавлен флаг, блокирующий pixelshift-анимацию партнёра
  - qol: Сердечки можно включать и выключать, менять параметр входе раунда без актуализации
      персонажа, сохраняется для всех персонажей на аккаунте.
  - code_imp: play_interaction_effect() теперь принимают тип эффекта (возможность
      добавления других визуальных эффектов, вместо сердечек)
  - refactor: play_interaction_effect() вызывается в едином месте кода, не разбросаны
      в каждом интеракте
  - rscdel: Quirq "Lewd job" был удалён, за ненадобностью
