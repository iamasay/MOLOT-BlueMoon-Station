changes:
  - bugfix: Фаны больше не разбираются, если поставить их на плитку и разобрать её
      до уровня обшивки.
  - bugfix: Фан из пластали корректно разбирается, если полностью уничтожить пол под
      ним.
  - code_imp: Добавлен компонент requires_floor, хендлер qdel() турфа пола под собой,
      для задач слежки и разборки/удаления объектов, которые не должны существовать
      без поверхности.
  - spellcheck: Перевод строк для tiny fan, powered microfan, fan assembly.
