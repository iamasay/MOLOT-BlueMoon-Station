author: Herobrine998
delete-after: true
changes:
  - rscadd: Портирована и улучшена миникарта для Crew monitor с 1984
  - rscadd: Миникарта генерирует под каждый этаж свою картинку + имеются кнопки просмотра
      разных этажей и масштаба
  - rscadd: На миникарте есть отдельный режим, что красит отделы в их цвет
  - rscadd: Каждый персонаж с датчиками будет показываться на миникарте, в зависимости
      от урона, будет меняться его цвет
  - rscadd: Персонажа можно отметить и тогда он будет выделяться особым образом на
      миникарте + показываться сверху списка.
  - rscadd: Ваша позиция на миникарте отмечена золотым маркером, для удобства
  - rscadd: В локацию на крю мониторе добавлены точные координаты персонажа
  - rscadd: Добавлена стрелочка как в GPS, указывающее направление и метры до цели
      в крю мониторе
  - bugfix: Пофикшены баги у поинтера
  - rscadd: Кнопка в OOС Показать миникарту переведена на TGUI
