author: DuLL-FoX
delete-after: true
changes:
  - rscadd: Вся враждебная фауна - станционная, шахтёрская, лавалендская и модульная
      - переведена на новый AI. Моб помнит, куда вы ушли из виду, и ищет вас по последней
      замеченной позиции, обходит препятствия, открывает доступные ему двери, зовёт
      в бой союзников, которых видит, держит свою территорию, возвращается на пост
      и отступает, когда сильно ранен.
  - rscadd: 'Мобы реагируют на происходящее вокруг: на полученный урон, на контакт
      союзника и на выстрелы в пределах 5 тайлов, а не только на то, что попало им
      в поле зрения. Реакция мгновенная, а не на следующем проходе AI.'
  - rscadd: 'Дальнобойные мобы дерутся позиционно: расходятся вокруг цели, выходят
      из зажима, ищут позицию сбоку, не стреляют через союзников, стены и диагональные
      углы и плавно отходят, когда держат дистанцию.'
  - rscadd: Стайные мобы окружают цель по ролям, засадные терроры ждут добычу в узких
      местах, а моб, которому перекрыли дорогу телом, бьёт помеху вместо обхода по
      кругу.
  - rscadd: Боссы, терроры, карпы, пауки, пчёлы, крысы, слаймы, ксеноморфы, конструкты
      и прочие особые кластеры сохранили свои механики и фазы, но получили специализированные
      контроллеры вместо собственных копий логики.
  - balance: 'Частота ударов мобов приведена к клик-кулдауну игрока, а кэп скорости
      погони равен обычной скорости фауны: дефолтный моб бегает ровно как раньше,
      режутся только специально ускоренные, которые читались как телепорт. Мегафауна
      и weeping angel из ограничения исключены.'
  - balance: Дальнобойные мобы стреляют не дальше радиуса экрана (7 тайлов) - если
      вы не видите стрелка, он не стреляет по вам. Преследовать и искать они по-прежнему
      могут дальше.
  - balance: Тяжёлый удар голиафа получил читаемое окно замаха и отменяется, если
      жертва успела отойти.
  - balance: Слаймы ищут добычу тем же механизмом, что и остальные мобы. В открытом
      загоне разницы нет.
  - bugfix: Моб больше не упирается в дверь, которую не может открыть, не лезет в
      вакуум, лаву и пропасть, если это его убьёт, и не удерживает бесконечно цель,
      до которой нет пути.
  - bugfix: Мобы не выбирают цель случайно, не мечутся между целями от одного толчка
      и не стоят в очереди за союзником.
  - bugfix: Моб не ломает дверь или камень в стороне от своего маршрута, пока путь
      ещё строится, но и не застывает перед настоящей преградой, когда пути нет вовсе.
      Маршрут перестраивается, когда цель с него ушла, вместо бега к месту, где её
      давно нет.
  - bugfix: Кап кубо-обезьян перестал пропускать одну сверх настроенного лимита.
  - bugfix: Консоли камер и ксенобиологии больше не отказываются открываться из-за
      сети камер, заданной числом на карте или в схеме видеокамеры.
  - bugfix: Фобия, сохранённая до того, как её убрали из игры, больше не доезжает
      до раунда неизменной.
  - bugfix: Ксенохимера вне мира больше не роняет свою обработку жизни каждые две
      секунды, а трекинг-маяк экзокостюма не заводит перезарядку после того, как уничтожил
      себя собственным ЭМП.
  - bugfix: Переименование канистры, сброс давления и таймер клапана открываются через
      обычный интерфейс, а не нативным окном, которое зависало на дисконнекте.
  - code_imp: 'Уход с турфа больше не опрашивает всё, что на нём стоит: нативный проход
      BYOND отключён, а Uncross() зовётся только у атомов, которые объявили blocks_exit_checks.
      Окна, перила, windoor, турникеты, лестницы, бордюрные пожарные шлюзы и силовые
      поля держат выход как раньше, но у мобов и предметов переопределение Uncross()
      теперь не вызывается - для них нужен COMSIG_ATOM_EXIT через connect_loc.'
  - code_imp: Обработка ввода не прогоняет полную цепочку шага на игроке, который
      не держит клавиш движения. Ходьба должна ощущаться ровно так же - если после
      остановки появится лишний или пропавший шаг, дело в этом.
  - server: 'Мобы стали заметно дешевле: до моба без игроков рядом подсистема теперь
      даже не доходит, а карбонный Life(), каскад обновления здоровья, гравитация
      и перерисовка внешнего вида пересчитываются только на фактических изменениях.
      Отдельно закрыты источники тик-спайков и утечек: баллистические стволы и ящики
      патронов, экраны камер и попапов, наведение курсора наблюдателем, удалённая
      машинерия в mob.machine, электроника дверных сборок и нативные окна канистры.'
  - admin: Моб под управлением игрока или админа полностью отдаёт управление человеку,
      а NPC-логика включается обратно при выходе. Постоянно без NPC-AI остались только
      player swarmer, eldritch demons, guardians и herald mirror.
  - refactor: Старый hostile-планировщик, SSchunks и переключатель обратно на легаси
      удалены - все hostile-мобы обслуживаются одной системой. Планировщик снарядов
      переведён на честные epoch-очереди с ограниченным catch-up.
  - code_imp: Добавлены воспроизводимые headless-бенчмарки AI и расширенное покрытие
      юнит-тестами.
