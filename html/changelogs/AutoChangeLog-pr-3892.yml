  - rscadd: Сперма теперь выводится чуть быстрее из организма и чуть больше насыщает.
      Фемкам по старому, а синтспера почти не насыщает
  - rscadd: У омлетов повышен трансфер реагентов за укус
  - rscadd: Ресток маквульпикса добавлен в карго
