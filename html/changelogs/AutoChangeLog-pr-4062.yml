author: DuLL-FoX
delete-after: true
changes:
  - tweak: 'Пляска: фигура засчитывает направление шага на каждой доле. Можно идти,
      не отпуская клавишу, а шаги между долями фигуру не сбивают.'
  - tweak: 'Пляска: фигуры собираются только под музыку, то есть в бою или пока есть
      Такт. Вне боя ходьба больше не запускает хоровод.'
  - bugfix: 'Чужую музыку Пляски теперь слышно: в полную громкость до 3 клеток, затихает
      к 7.'
  - qol: В меню стиля у каждого танца подписана роль. «Первый такт» переписан в порядке
      освоения.
  - qol: Если сердце отказывает по несломленной цели, оно подсказывает способ захвата
      вашего пути.
  - bugfix: Урок Пляски называл неверное время партнёрства.
  - rscadd: 'Номера Пляски: фигура, связка в другой стиль в сильную долю и фигура
      нового стиля. Па-де-де (Вальс → Танго) делает ведомого партнёром. Танго смерти
      (Танго → Тарантелла) после 4 точных укусов даёт 6 с пляски и 32 урона. Пляска
      мертвецов (Канкан → Пляска смерти) тянет до 6 врагов в хоровод. Исчезновение
      (Пляска смерти → Канкан) даёт рывок, маску и скорость.'
  - balance: Номер срабатывает не чаще раза в 30 с, во время Болеро без перезарядки.
      Партнёр от Па-де-де держится 3 с, цель охоты 6 с.
  - imageadd: Свои кульминации у четырёх номеров.
  - soundadd: Свои звуки у четырёх номеров.
