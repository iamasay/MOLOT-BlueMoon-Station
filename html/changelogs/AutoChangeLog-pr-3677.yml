author: Silver-Paws
delete-after: true
changes:
  - rscadd: Добавлен HUD индикатор "голода" для персонажей-синтетов в виде батарейки.
      Батарейка кликабельна для доп. инфо.
  - rscadd: Добавлен HUD индикатор здоровья киборгов персонажам-синтетам вместо электрокардиограммы
      органиков.
  - rscdel: Убран HUD индикатор жажды для синтетов
  - bugfix: Hydraulic Fluid Counter теперь корректно кликабелен для доп. инфо об охлаждении.
  - bugfix: Квирк "Сознательный" теперь даёт корректные строчки информации при асфиксии
      и токсинах.
  - image: Hydraulic Fluid Counter получил текстурирование спрайтов. Позже получит
      ремастер-версию.
  - spellcheck: Перевод для power cord импланта персонажей-синтетов.
  - spellcheck: Персонажи-синтеты получают уникальные строчки статуса "настроения"
      и "рассудка", насыщения. Не получают строчки статуса жажды.
  - code_imp: Игра теперь сначала добавляет трейты, затем обновляет HUD и видимость
      слотов инвентаря персонажа во время `on_species_gain()`.
  - code_imp: Обновление HUD голода и жажды кукол теперь привязано к adjust-прокам
      обоих систем, нежели обновлении здоровья.
  - code_imp: Персонажи больше не получают принудительное обновление здоровья со всей
      вереницей связанных проков, если не подышали стимулом/нитрилом - проверяется
      минимальное значение в атмосфере.
