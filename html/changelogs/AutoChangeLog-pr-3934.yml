author: DuLL-FoX
delete-after: true
changes:
  - code_imp: Каталоги звуков меню взаимодействий кэшируются и передаются через статические
      данные TGUI.
  - code_imp: Давление и параметры эха рассчитываются один раз на рассылку звука.
  - code_imp: Джукбокс больше не отправляет лишние команды остановки игрокам с отключённой
      музыкой.
  - code_imp: При полном снятии HUD его изображения удаляются одним пакетом.
  - bugfix: Полное снятие HUD учитывает изменение видимости и повторные подключения
      наблюдателя.
  - admin: Поиск клиентских ссылок при сбоях GC выполняется отложенно с уступкой тика
      и проверкой актуальности объекта.
