author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Пикетные таблички снова принимают надпись — ручкой и мелком; пустая надпись
      стирает плакат. Неграмотный больше не может расписаться мелком.
  - bugfix: Ручка и мелок не открывают поверх плаката второе окно переименования и
      не рисуют по нему граффити.
  - bugfix: Кнопка перепрошивки нано-плаката борга даёт ввести текст, а не машет плакатом.
  - bugfix: Знак, снятый со стены ключом и повешенный обратно, больше не оказывается
      посреди пола и не теряет направление.
  - rscadd: Пикетный плакат можно вкопать в пол или повесить на стену на «помощи»
      — он останется с надписью, снимается руками обратно.
  - rscadd: Пикетные плакаты попадаются в луте мейнтенанса.
  - tweak: Выбор типа знака ручкой собирается из дерева типов и больше не морозит
      клик на время выбора.
  - soundadd: Смена надписи на плакате теперь слышна.
  - imageadd: Спрайты вкопанного и настенного пикетного плаката.
