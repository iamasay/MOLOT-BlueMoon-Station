author: DuLL-FoX
delete-after: true
changes:
  - bugfix: 'Спрайты больше не подменяются картинками других вещей: кэши иконок в
      панели осмотра турфа, в чужом инвентаре и в чате ключевались ссылкой, которую
      BYOND переиспользует после сборки мусора.'
  - bugfix: Освещение перестало плодить у клиента по новому уникальному оттенку на
      каждое движение источника света. Это оно набивало память до чужих спрайтов и
      чёрных квадратов перед вылетом.
  - bugfix: Наркотики и наносьют больше не сносят маску освещения, конус обзора и
      линзы сингулярности вместе со своим эффектом, а фильтр костюма не теряется от
      чужого эффекта.
  - bugfix: Ссылка слежения в чате и меню орбиты ведут к исходной цели, а не к тому,
      что заняло её место. Клик по мёртвой ссылке пишет об этом в чат.
  - bugfix: Оверлей повреждения синтетика держит один эмиттер частиц вместо нового
      на каждое обновление здоровья, и достаётся он синтетикам, а не любому отравленному.
  - bugfix: Полноэкранные эффекты урона перестали пересчитываться по шесть раз на
      каждое обновление здоровья.
  - bugfix: Тень стамина-крита снимается, а не копится до конца раунда.
  - bugfix: Буфер спринта появляется на экране, кнопка спринта больше не добавляется
      дважды.
  - bugfix: Панели нейроинтерфейса снимаются с экрана при удалении модуля, показывают
      целые числа вместо сырых дробей, а записи логов заменяются, а не плодятся.
  - bugfix: Пятна крови и градиенты волос перестали строить новую иконку на каждое
      обновление.
  - tweak: Подсказка под курсором занимает коробку по своему размеру, а не по размеру
      окна.
  - tweak: Дрожь и коробка рунчата перестали плодить уникальные состояния спрайта
      на каждый тик, печатная машинка рунчата рисует восемь кадров вместо сорока при
      прежней длительности.
  - image: Скайбоксы, погодные слои параллакса и редкие полноэкранные эффекты разнесены
      по отдельным файлам, клиент грузит только то, что видит. Пиксели не тронуты.
  - imagedel: Снят screen_full.dmi, 33 его стейта слово в слово повторяли fullscreen_15x15.dmi,
      а ссылавшийся на него тип нигде не создаётся.
  - code_imp: Свет отложенных z-уровней не сносится под игроком, который на нём только
      что был, и не поднимается целиком ради пролетевшего госта.
  - code_imp: Лестница предупреждений о памяти ходит ступенью 96 МБ и печатается на
      раунде обычной длины, а не только на пятичасовом.
  - code_imp: Пересборка спрайтшита пишет в лог свой исход, снос света печатает, сколько
      памяти вернул системе.
  - code_imp: Тесты на кэши иконок без ключей-ссылок, бюджет поверхностей maptext,
      идентичность ссылки слежения, эмиттеры повреждения синтетика, снос и матрицу
      освещения.
  - server: 'CI держит потолок 32 МБ на распакованный DMI и храповик 2329 МБ на всё
      дерево иконок: клиент 32-битный, и расти дереву молча больше нельзя.'
