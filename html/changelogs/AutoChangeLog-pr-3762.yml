author: MrPe4henika
delete-after: true
changes:
  - rscadd: Добавлено новое приятное освещение от ламп и общее.
  - rscadd: Введена система изменения освещения в зависимости от отделов. Цвет освещения
      частично изменяется в зависимости от отдела.
  - rscadd: 'Добавлены новые параметры настройки: (Сглаживание, Качество, Блум, Яркость,
      Яркость ламп)'
  - rscadd: 'Добавлена возможность переключения освещения: БЫСТРО/КАЧЕСТВЕННО. Вариант
      быстро, отключает фильтр насколько это возможно, тем самым отключая рендер и
      нагрузку на ваше устройство.'
  - rscadd: Некоторые мелкие изменения, которые скорее всего я забыл вспомнить.
  - rscadd: Изменения аварийного освещения, теперь оно чуть более светлое.
  - rscadd: Аварийное освещение больше не будет тухнуть, а точнее не будет разряжаться
      батарейка внутри лампочки, пока работает/заряжено APC.
  - rscadd: Добавлены параметры сглаживания (0-4) для более детальной настройки возможности
      под свои устройства.
  - rscadd: Ночное освещение теперь отключается при уровне угрозы Янтарь и выше!
  - bugfix: Исправлена ошибка яркости, дающая возможность игроку получить легит ПНВ.
