author: DuLL-FoX
delete-after: true
changes:
  - bugfix: 'осиротевшие move-лупы AI больше не спамят рантаймами до конца раунда:
      луп самоуничтожается при потере пауна или контроллера, а остановка движения
      не зависит от уже удалённого пауна'
  - bugfix: имплант-помпа афродизиака не крутится в обработке без носителя
  - bugfix: мёртвая ссылка в списке слышащих (pAI-гарнитуры и т.п.) больше не роняет
      рассылку сообщений
  - bugfix: копирование ареа (голодек, ресет тандердома) больше не ломает освещение
      вокруг копии и не оставляет мусорные lighting_object
  - bugfix: огнемётные снаряды больше не рантаймят на каждом попадании
  - bugfix: осмотр стреляной гильзы больше не падает
  - bugfix: автомат в руках у обезьяны больше не ломает компонент автоогня
  - bugfix: панель амбиций открывается у разума без тела
  - bugfix: плазменную лаву Сноудина можно тыкать не только тарой
  - bugfix: оральный климакс с яйцекладкой откладывает яйцо, а не рантаймит
  - code_imp: safe_json_decode пишет стек-трейс на битом JSON и молчит на пустом входе
  - code_imp: перенос варов турфа при копировании ареа вынесен в copy_template_vars
      и не таскает ссылки на чужие датумы
