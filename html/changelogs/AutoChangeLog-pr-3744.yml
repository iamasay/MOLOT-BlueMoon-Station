author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Форсаж ножных приводов Gygax и Medical Gygax включается с первого нажатия
      и выключается со второго, а не наоборот.
  - bugfix: Выключение форсажа больше не отнимает у Medical Gygax штатный таран; кнопка
      нового пилота показывает реальное состояние форсажа.
  - balance: 'Форсаж не высушивает ячейку: цена шага снижена в 10 раз, ниже 10% заряда
      форсаж не включается и гаснет сам, чтобы мех мог дойти до зарядки.'
  - bugfix: Мех, поставленный с карты, платит за шаг свою штатную цену, а не типовые
      10.
  - bugfix: Превью конструктора IPC и Color Mate, фото в консолях записей больше не
      пересобираются на каждое обновление окна.
  - bugfix: 'Обезьяны и слаймы ксенобио-фермы больше не уходят в харддел: цель ИИ
      отпускается при удалении, цикл ходьбы гасится.'
  - bugfix: МОД-костюм больше не теряет части в харддел, части корректно выпадают
      при разборке и убираются с тела при снятии костюма силой.
  - bugfix: UV-цикл шкафа скафандров теперь действительно уничтожает содержимое.
  - bugfix: Состояние чат-панели и позиции кнопок действий пишутся одной строкой вместо
      перезаписи всего савфайла; позиции кнопок реально сохраняются между раундами.
  - bugfix: Свет пустого z-уровня не сносится повторно, если прошлый снос ничего не
      вернул, и не воюет с фоновой постройкой того же уровня.
  - bugfix: Атмос-машинерия (венты, скрабберы, воздушные и пожарные сигнализации)
      переезжает за разметкой комнаты блюпринтами и за спавном шаттла, тревоги не
      застревают на старой зоне.
  - bugfix: Венты и скрабберы в шаблонах, заспавненных в середине раунда, больше не
      выключаются сами при загрузке.
  - bugfix: Мешок для трупов теперь видно, что он открыт. Раньше повторный клик засасывал
      тело обратно, и оно выглядело пропавшим.
  - bugfix: БСС мешок больше не пытается сложиться дважды.
  - bugfix: Вставка мозга в тело с уже имеющимся мозгом роняет старый на пол, а не
      удаляет его вместе с разумом владельца.
  - bugfix: Синтетическое сердце запускается обратно после починки или замены, но
      дефибриллятор не перезапускает отказавшее сердце.
  - bugfix: Дефибриллятор больше не накапливает урон мозгу с каждым разрядом.
  - bugfix: Психоз у игрока без клиента больше не сыплет рантаймами.
  - bugfix: Ген парализованного снимает свою травму при потере мутации и не перетирает
      паралич от квирка.
  - bugfix: Питомец на поводке больше не сносит комнату отеля Гильберта под хозяином.
  - bugfix: Заспавненный в раунде корабль не теряет пункт custom location в навигационной
      консоли.
  - bugfix: Шасси Feline и Ratvar Meka видны и имеют позы отдыха. Хамелеон-модуль
      после отключения возвращает борга в его собственное шасси и снимает сдвиг спрайта.
  - bugfix: Дохлая мышь видна в руках, коробка вульпбургера не пропадает с закрытой
      крышкой.
  - bugfix: Убраны точки-дырки на комбинезонах на женском теле.
  - bugfix: Массовая галлюцинация больше не тратится на мобов без клиента, картинки
      галлюцинаций снимаются с того клиента, что их получил.
  - bugfix: Плашка с запретом посещать станцию не показывается гост-ролям, которые
      спавнятся на самой станции.
  - bugfix: Свармер-спавнер с двумя гостами одновременно больше не спавнит пустоту.
  - bugfix: Плазмамены и админские аутфиты не кладут в слот внутренних баллонов что
      попало.
  - bugfix: Квирк с семейной реликвией не падает, если рюкзака или самой реликвии
      на носителе уже нет.
  - bugfix: Вещи, разлетевшиеся взрывом над опенспейсом, больше не сыплют стектрейсами.
  - bugfix: Голодек больше не теряет оверлеи, подложки и фильтры при копировании площадки.
  - bugfix: Починены рантаймы антиматерии, камеры вне турфа и кнопки участия в распределении
      гост-ролей.
  - bugfix: Панель мехи гасит таймер после закрытия, проверка "внутри ли меха" снова
      работает, обновление не замирает после стана пилота.
  - bugfix: Апгрейды боргов не падают при сбросе модуля, стойки крав-маги и рестлинга
      не пропадают после выдачи через панель, верстак патронов не заводит отрицательный
      таймер, накладная ящика не держится после взрыва, бинт киборга не самоудаляется.
  - bugfix: Противометеоритный спутник регистрировался дважды и не собирался GC.
  - bugfix: Кинг раз в сто спавнов становился невидимым.
  - bugfix: Экран интегральных схем повторяет сообщение после паузы, а не один раз
      за раунд.
  - bugfix: Музыкальная шкатулка не блокирует загрузку навсегда, если диалог выбора
      файла бросили.
  - balance: Гражданская синдикатская одежда даёт 5 WOUND, раньше она была буквально
      хуже голого комбинезона. Пуля, застрявшая в броне, больше не может оторвать
      конечность.
  - qol: Джукбокс и музыкальная шкатулка играют тем, кто рядом, а не всему серверу.
      Подошедший позже слышит трек с текущей секунды.
  - code_imp: Снятие изображений худа идёт батчем.
  - code_imp: Investigate-лог схем пишется через буфер rust-g и без дублей.
  - code_imp: 'Warnfail называет держателя удалённого моба: блэкборд ИИ, клиентские
      структуры, переменную-цель соседнего моба.'
