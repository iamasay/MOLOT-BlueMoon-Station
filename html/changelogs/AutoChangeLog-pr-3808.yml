author: Pe4henika
delete-after: true
changes:
  - rscadd: Новый интерфейс для сканера детектива, взамен старого кривого вывода в
      чат
  - rscadd: Новые бумаги для сканера детектива в качестве отчетов о том или ином сканировании.
  - rscadd: Мыло, Душ, Очиститель - теперь оттирают и кровь и отпечатки, можно скрывать
      следы своих грязных дел
  - bugfix: Исправление некоторых личных вещичек
  - bugfix: Исправление некоторых личных вещичек X10
  - rscadd: Теперь командование получает уведомление на ПДА о новом факсе. Если отправить
      факс для капитана - придет сообщение на ПДА капитана и так далее.
  - rscadd: Новые варианты крыльев для MOOOOTH. Добавлены Greyscale варианты, которые
      можно красить под свое желание. Переименованы и немного рассортированы крылья
      в редакторе для Moth
  - rscadd: Добавление новой системы штрафов!
  - rscadd: Консоль заданий брига получила новую функцию - Терминал оплаты штрафов
  - rscadd: Консоль криминальных записей службы безопасности получила новую кнопку
      - выписать штраф.
