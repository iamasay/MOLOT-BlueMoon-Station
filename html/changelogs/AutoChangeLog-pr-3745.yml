author: MrPe4henika
delete-after: true
changes:
  - rscadd: Скотч теперь является аналогам бинтов для синтетиков
  - rscadd: Возможность переключить, скрывает ли маска ваше лицо и описание на ALT+Клик
      по маске
  - rscadd: Крафт лестницы из 10 металла с удобной системой установки
  - rscadd: Анимация при выливании жидкости из ёмкости с использованием harm
  - rscadd: Персональные вещички чебупеля додо
  - rscadd: Переработан квирк "Водный аспект". Теперь квирк стоит 1 очко(Не мое),
      а также выдает подводное дыхание, дает возможность ускоренно передвигаться в
      воде
  - bugfix: Исправление логики "Уязвимость к воде" для синтетиков с бассейнами
  - rscadd: Синтетики с квирком "Уязвимость к воде" получают урон от контакта с лужами
      воды без сапог
  - rscadd: Автоматические эмоуты вздрагивания и так далее для синтетиков при контакте
      с водой
  - bugfix: Исправление органов ксенохиммер при возраждении. Теперь ксенохиммера просыпается
      с органами поврежденными на 20%, вместо полностью гнилых
  - bugfix: У лестниц в бассейн увеличено сцепление, теперь вы не падает и не ломаете
      себе черепа прямо с лестницы.
  - rscadd: Частично улучшил интерфейс Персонального музыкального проигрывателя, добавив
      кнопочки повтора и так далее для удобства
  - rscadd: Более 10-ти новых автоматических милогов для сигарет. РП КУРЕНИЕ
  - rscadd: В хамелионку боргов добавлены все варианты корпусов
  - rscadd: Hailer из СБТеха теперь можно установить в любую маску/противогаз - и
      дать ей возможности СБ Маски (Рация + Оповещение)
