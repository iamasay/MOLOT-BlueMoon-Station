author: DuLL-FoX
delete-after: true
changes:
  - bugfix: конвейеры больше не встают навсегда после скачка питания — лента возвращается
      в работу сама
  - bugfix: разрушенный или разобранный бак атмоса выпускает газ наружу, а не удаляет
      его
  - bugfix: о полученном факсе сообщает принимающий аппарат, поэтому факсы с ЦК больше
      не теряются
  - bugfix: факс, снятый с сети, больше не выдаёт себя объявлением об отправке
  - bugfix: армейский нож при смене инструмента остаётся тем же предметом и не теряет
      статус семейной реликвии
  - bugfix: костяной армблейд при потере руки остаётся предметом, а не исчезает
  - bugfix: нейтральная фауна больше не считает учёных ДС-1 врагами
  - bugfix: охрана шаттла держит обиду на того, кто её ударил, а не на весь экипаж
      рядом
  - bugfix: консоль трюма пиратов неразрушаема, а собранные кредиты и выкуп за заложника
      больше не обнуляются в отчёте
  - bugfix: серверы РНД перестали терять суммарную выработку при добавлении пятого
      и далее сервера
  - bugfix: водородный топор виден в руках персонажа
  - bugfix: тело игрока, управляющего клоном холодного лазурного, больше не уходит
      в автокрио
