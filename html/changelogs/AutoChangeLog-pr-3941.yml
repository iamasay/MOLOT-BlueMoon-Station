author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Восстановлено свечение ушей, хвостов, морд и других частей внешности.
  - bugfix: Крылья, усики и маркинги молей можно окрашивать раздельно.
  - bugfix: Цель на трусы капитана учитывает наличие предмета с нужной отметкой.
  - bugfix: Убрана повторная выдача часов и РЦД раундстартовым культистам Ратвара.
  - bugfix: Часы Ратвара в рюкзаке больше не добавляют кнопки быстрого доступа.
  - bugfix: Водный аспект защищает от удушья в бассейне.
  - bugfix: Исправлена потеря управления телом генокрада при уничтожении головы после
      замены мозга.
  - bugfix: Мячик и кляп во рту больше не искажают язык жестов.
  - image: Молетаракан в руках отображается собственным спрайтом вместо корги.
