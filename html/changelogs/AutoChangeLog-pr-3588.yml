author: DuLL-FoX
delete-after: true
changes:
  - rscadd: Пять слоёв труб вместо трёх; покраска решает, соединятся трубы или нет
  - rscadd: Мостовая труба и переходник цветов
  - rscadd: Омни-фильтр и омни-миксер с настраиваемыми ролями портов
  - rscadd: Температурный клапан, температурный насос и предохранительный клапан
  - rscadd: Аварийный аирбаг в оконной раме - держит давление, пока проём не застеклят
  - rscadd: Верхние рецепты кристаллизатора требуют высокого давления на подающей
      линии
  - rscadd: Плата кристаллизатора печатается в импринтере после исследования Industrial
      Engineering
  - rscadd: Пиронит - топливо высокого давления, горит вдвое жарче плазмы
  - rscadd: Флюксин - катализатор, раздвигает температурные окна чужих реакций и срезает
      расход сырья
  - rscadd: Первый синтез каждого газа приносит очки науки
  - rscadd: Второй уровень газовых наград даёт постоянные предметы, а не только гранаты
  - rscadd: Топливные пеллеты кристаллизатора заряжают аккумуляторы устройств конечным
      запасом энергии
  - rscadd: 'Внутриигровой справочник по атмосу: инструменты, методы и безопасность'
  - rscadd: Файрлоки показывают лампами причину тревоги
  - rscadd: Событие "Атмосферный поток" меняет скорость атмосферы на минуту
  - rscadd: Газоанализатор открывает окно вместо простыни в чат
  - rscadd: Атмос сам сбавляет каденцию, когда перестаёт укладываться в свой интервал
  - rscadd: Проектор холофанов тратит заряд, пока проекции развёрнуты, и гасит их
      на нуле
  - rscadd: Исследуемый Sustained Field Projection - одна проекция держится сколько
      угодно
  - rscadd: 'Окно гиперторуса разложено по вкладкам: обзор, рецепты, тонкая настройка
      и фильтрация'
  - tweak: Теплопередача через стёкла и стены снова работает, отключается конфигом
  - tweak: Ветер от разгерметизации складывает перпендикулярные утечки в диагональ
  - tweak: Пожарная сигнализация замечает нагрев, а не только открытый огонь
  - tweak: Цены газов выстроены по сложности синтеза - глубокий газ больше не дешевле
      простого
  - tweak: Заукерит стоит 400 молей вместо 33
  - balance: Хилиум больше не лечит тем быстрее, чем больше его в крови - ставка фиксирована,
      а сверх 30 единиц начинается передоз
  - balance: 'Дыхание хилиумом больше не лечит напрямую и бесплатно: газ попадает
      в кровь реагентом, как заукер'
  - balance: Хилиумный шард и хилиумный болт ребар-арбалета вкалывают 5 единиц вместо
      10
  - balance: Хилиумный дефибриллятор после успешной реанимации лечит 25 физического
      и 25 ожогового урона
  - balance: Нитриумные ботинки восстанавливают рывок за 4,5 секунды вместо 6 у шахтёрской
      модели
  - qol: Атмос-интерфейсы показывают состав смеси в трубах и на портах
  - qol: Все газы получили подпись, различимый цвет и описание в справочнике
  - qol: Описание гиперноблиумного кристалла теперь точно объясняет обработку обычной
      одежды
  - qol: Реакции газов описаны по-русски, с подписями всех факторов
  - qol: Гиперторус объясняет, почему шаг запуска заблокирован, вместо молча погасшей
      кнопки
  - qol: Гиперторус жалуется числами на перегруз камеры, железо, нехватку топлива
      и пустой контур охлаждения
  - qol: Рецепты синтеза показывают требуемые газы, продукты и множители, а не одно
      название
  - qol: Температуры контуров гиперторуса собраны на одной шкале со скоростью изменения
  - bugfix: 'Спайк лагов на старте раунда: атмос больше не будит десятки тысяч турфов
      впустую'
  - bugfix: Девять пар канистр перестали делить один спрайт - хилий больше не выглядит
      как азот
  - bugfix: Канистры фреона и плуоксия больше не исчезают, когда их начинают расходовать
  - bugfix: Прототипная канистра перестала быть невидимой
  - image: Свои спрайты девяти канистрам, хилиевому дефибриллятору и нитриевым ботинкам
  - bugfix: Файрлок больше не защёлкивается навсегда на улице планеты и в вакууме
  - bugfix: Аварийные створки захлопываются от опасного перепада давления прямо в
      дверном проёме, не дожидаясь зонной тревоги
  - bugfix: Зона у пробоины перевзводит декомп-тревогу, пока держит выживаемое давление,
      - створки больше не переоткрываются посреди затяжного слива
  - bugfix: Осмотр файрлока снова показывает, что видит его атмосферный датчик
  - bugfix: Открытый ломом файрлок не захлопывается обратно следующей же тревогой
  - bugfix: Лампы файрлока перестали мигать на кромке пожара
  - bugfix: Закрытая автоматикой аварийная створка открывается сама, как только причина
      закрытия отпала, а не стоит закрытой до конца смены
  - bugfix: Створки на шаттлах снова следят за своим окружением, а не за плитками
      дока, с которого шаттл улетел
  - bugfix: Створки в сжигателе и турбине не захлопываются от штатного горения
  - bugfix: Раздатчик труб больше не ломает цель при выключенном режиме сноса
  - bugfix: Блюспейс трубоукладчик раздаёт всю новую машинерию, а не только старый
      набор рецептов
  - bugfix: Плитка в зелёном интенте кладётся на пол, а не бьёт трубу
  - bugfix: Шкалы и подписи температур гиперторуса больше не врут
  - bugfix: Кнопки давления баллона дизейблятся на упорах
  - bugfix: Стёкла, решётки и канистры с улетевшего шаттла больше не текут в hard
      delete
  - bugfix: Голодек перестал ломаться на весь раунд после смены турфа под ним
  - bugfix: Паучок в вентиляции перестал ездить после удаления
  - bugfix: Клинбот с выданным ножом снова разбирается целиком
  - bugfix: Турф, на котором потушили огонь особым образом, снова умеет загораться
  - bugfix: Настройки сохраняются, даже если щёлкать их без остановки
  - bugfix: Разгерметизация рядом со снесённой стеной больше не сыплет ошибками
  - bugfix: Взрывы больше не замораживают сервер на время пересборки труб - сеть строится
      по частям между тиками
  - bugfix: 'Сингулярность снова ищет еду: прок навигации падал с ошибкой при каждом
      вызове с момента появления, и она всю жизнь ходила случайно'
  - bugfix: Космос снова читается холодным - мобы в открытом космосе (слаймы, фауна,
      экипаж) опять замерзают
  - bugfix: Разгерметизированная в космос комната оседает холодной, а не застревает
      тёплым вакуумом - клинок еретика Пустоты и морозильные комнаты ксенобиологии
      снова работают
  - code_imp: Атмос-машинерия и осевшие турфы спят по холостым фаерам
  - code_imp: Снятие турфа из активного списка атмоса идёт за постоянное время без
      каскада
  - code_imp: Загрузка карты перестала быть квадратичной по числу открытых турфов
  - code_imp: Запись настроек перестала морозить сервер на каждое изменение зума окна
  - code_imp: Эмиттер, панель игроков, пена, статус-дисплеи и боты перестали греть
      вхолостую
  - code_imp: 'Телеметрия атмоса чинена: мёртвые колонки заменены, счётчик смесей
      считает живые'
  - code_imp: Пределы регуляторов и пороги гиперторуса отдаются интерфейсу из тех
      же дефайнов, по которым их проверяет машина
  - code_imp: Очередь пересборки пайпнетов дедуплицируется флагом вместо поиска по
      списку
  - map: Карты пересохранены под новую нумерацию слоёв труб
  - image: Спрайты омни-девайсов, слоёв труб и ламп файрлоков
  - image: Спрайт устойчивого проектора холофанов
  - balance: 'Разгерметизация работает как на tg: тайл у пробоины отдаёт весь воздух
      за тик, спейсвинд у дыры тянет полной силой'
  - rscadd: Роундстартовые активные турфы логируются в mapping-лог, вербы Show roundstart
      AT list/markers снова работают
  - code_imp: Горячие атмос-проки переведены на двухпеременную итерацию ассоциативных
      списков
  - config: ATMOS_HEAT_ENABLED, ATMOS_SPEED_MULTIPLIER и ATMOS_SLEEPING_EDGES - экспериментальный
      перф-режим осевших пар, по умолчанию выключен
  - admin: Панель управления атмосом, переключатели теплопередачи и спящих рёбер,
      бенчмарк
