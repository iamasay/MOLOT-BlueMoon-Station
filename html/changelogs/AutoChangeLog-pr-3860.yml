author: MrPe4henika
delete-after: true
changes:
  - rscadd: Добавлен прогресс бар вместо инициализации в чате. Инициализацию все еще
      видят администраторы.
  - rscadd: Добавлена википедия в магазин приложений на ПДА и Консолях. На устройствах
      Службы Безопасности и Юристов приложение предустановлено.
  - rscadd: Дионы больше не дышут!
  - rscadd: Нюклиации были доработаны и теперь лечатся засчет радиации, плутония,
      урана и прочих радиоактивных штуковин!
  - rscadd: Добавлена возможность быстрого сокрытия action buttons в верхней панели
      через ctrl+клик
  - rscadd: Добавление анти-мета систему в критическом состоянии. Если персонаж попадает
      в критическое состояние, все персонажи вокруг заменяются на неизвестных.
  - rscadd: Добавление нового форматирование и поддержки цветов в описании персонажей.
