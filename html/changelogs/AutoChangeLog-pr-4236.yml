author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'Тренировочный полигон: вход из Гост-Кафе, программы для всех антагов
      ротации и ролей экипажа, сектора механик станции.'
  - rscadd: 'Упражнения с проверкой и оценкой: генокрад, предатель, зомби, банда,
      ксеноморфы, маг, Кошмар, СБ, медицина и механики станции.'
  - rscadd: 'Хаб полигона: вестибюль, мини-станция с отделами, площадки с пресетами
      комнат, должности экипажа, ИИ и киборг.'
  - rscadd: Группы с бронью секторов, сценарии групп, своя сборка сценария и дуэли.
  - admin: Режим стенда для админов, кодеров и менторов.
  - map: Капсулы тренировочного полигона в Гост-Кафе.
  - bugfix: Держатель сборки после взрыва гранаты больше не остаётся в памяти.
