author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Крио больше не оставляет на полу личный КПК с айди-картой внутри
  - bugfix: Химия внутри тела снова работает - сахар, вода, кровь и salglu больше
      не блокируют все реакции разом
  - bugfix: Жестовый язык больше не звучит вслух, не пробивает стены и не отбивается
      у немых, безлёгочных и в наморднике
  - bugfix: Шкаф с замком возвращает плату доступа при разборке
  - bugfix: Шапки на Иане и других питомцах отображаются, даже если для них нет отдельного
      спрайта, а осмотр перечисляет надетое
  - bugfix: Розовый стабильный экстракт снова успокаивает фауну, которую до этого
      задели
  - bugfix: Слаймы больше не встают намертво из-за одной выеденной мартышки в загоне
  - bugfix: Холодильник для экстрактов больше не забирает стабилизированные
  - bugfix: Дым оранжевого экстракта и кулдаун свечения жёлтого работают как задумано
  - bugfix: Напитки без градуса больше не стирают действие стерилизина, а операции
      сообщают о неверном инструменте
  - bugfix: Приветствие в начале смены уважает настройку звука объявлений
  - bugfix: Всплывающие окна с таймаутом от минуты больше не закрываются сами, а бонус
      стерилизина к операциям не гаснет раньше первого шага
  - bugfix: Выбранная в настройках фобия больше не подменяется случайной при заходе
      в раунд
  - code_imp: Убраны утечки обезьян и слаймов через список движения ИИ и вечный цикл
      ожидания в tgui-окнах
