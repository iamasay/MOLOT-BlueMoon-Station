author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Petsplosion больше не клонирует животных сверх потолка в 400 штук
  - bugfix: Petsplosion, Race Swap и Magicarp больше не вызывают фризы сервера на
      несколько секунд
  - bugfix: после Race Swap удалённые персонажи больше не вызывают лагов при сборке
      мусора
  - code_imp: сон и лечение без урона больше не пересчитывают здоровье каждый тик
  - code_imp: настенный монитор витальных показателей перерисовывается только при
      смене показаний
  - code_imp: анимации подбора предметов, всплесков, тумана костра и тёмной сабли
      видят только те, кто рядом
  - code_imp: осмотр ID-карты больше не пересобирает её иконку
  - server: логаут игрока пишется в лог спайков с числом оставшихся ссылок на клиента
  - server: в перф-CSV добавлены колонки observer_clients и observer_images_total
