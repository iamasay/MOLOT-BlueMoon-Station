author: Herobrine998
delete-after: true
changes:
  - rscadd: Для генетики добавлена система печати только в допустимый код. Напечатанные
      инжекторы так-же учитывают код, в который могут быть активированы, поэтому "печатать
      в прок" не имеет смысла. Можно емагнуть как консоль и печатать без ограничений,
      так и отдельный инжектор.
  - rscadd: Корпоративные (кодовые) импланты теперь работают не зависимо от кода,
      вне сектора станции, лавы и инфинити
  - map: На мету, бокс и дельту добавлены medipen refiller в медблок
  - refactor: Переработан medipen refiller, теперь ему не требуются реагенты, он медленно
      будет заполнять медипены из базовых аптечек. В базе имеет 2 слота для медипенов,
      улучшаются бинами. 2 минуты на заполнение медипена, улучшается манипуляторами
      в процентах.
