author: DuLL-FoX
delete-after: true
changes:
  - server: свет отложенных z-уровней больше не держится сверх кванта в два уровня
      разом - пустующий сверх кванта отдаётся через полторы минуты вместо четверти
      часа.
  - server: 'только что поднятый z-уровень больше не сносится сразу же: раунд 10126
      поднимал и сносил свет сорок два раза, ничего этим не экономя, но вспыхивая
      белым в глаза всем, кто на уровне.'
  - server: под высоким давлением памяти срок простоя перед сносом света сокращается
      с пятнадцати минут до трёх, а у самого потолка - до одной, и там же снимается
      защита только что поднятого уровня.
  - code_imp: подъём света z-уровня пишет в лог свой повод, а перф-CSV получил счётчики
      подъёмов и сносов.
  - code_imp: заведена книга недатумных аллокаций - иконки, ассеты, нагрузки tgui
      и статбраузера теперь считаются и печатаются в блоке скачка памяти рядом с вердиктом.
  - code_imp: VmSize до первой строки DM снимается на проде и печатается в лог - четверть
      базы памяти раньше не измерялась вовсе.
  - code_imp: строка о цене подключения больше не приписывает входящему игроку мегабайты,
      потраченные инициализацией мира.
  - code_imp: список эха звука строится один раз на пару значений, а не заново на
      каждого слушателя каждого позиционного звука.
  - bugfix: лампа снова применяет обновлённые оверлеи при смене яркости или цвета
      зоны - найтшифт и тревога до спрайта больше не теряются.
