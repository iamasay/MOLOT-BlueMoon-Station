author: Herobrine998
delete-after: true
changes:
  - rscadd: Добавлен элемент амбидекстрии, при ударе предметом в руке, будет почти
      мгновенная попытка удара предметом по второй руке
  - rscadd: Лазерные мантисы от емага вырезаны, добавлены отдельные триторские мантисы
      с повышенным уроном и бронепробитием в аплинк
  - rscadd: Мантисы получили возможность вскрывать шлюзы (как у армблейдов)
  - image: Спрайты мантисов портированы с 1984 + реколор для корпоративной версии
  - rscadd: Квирковые когти и когти из техфаба получили амбидекстрию, но у квирковых
      понижен урон
  - rscadd: Армблейды получили амбидекстрию (актуально для зомби генокрадов и игрушек)
  - rscadd: У зомби генок армблейд чуть хуже стал пробивать броню
  - bugfix: У игрушек починены звуки удара
  - bugfix: Фикс невозможности достать ручной имплант через кнопку, если активная
      рука занята, хотя нужный слот свободен
