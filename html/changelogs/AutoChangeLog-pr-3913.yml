author: Silver-Paws
delete-after: true
changes:
  - sound: 'Переработана адресация звуков взрывов: новый звук используется для взрывов
      силой от лимитки и выше, ещё один - в технических туннелях, а explosioncreak
      скрипучие взрывы - только на станции.'
  - bugfix: Взрывы больше не проигрывают лишние аудиодорожки за пределами слышимой
      зоны; delayed hull creaking слышат только игроки, которые действительно могли
      слышать взрыв.
  - code_imp: Добавлена проверка слышимости взрывов с учётом наличия клиента у игрока,
      слуха и атмосферного давления в турфе его нахождения.
