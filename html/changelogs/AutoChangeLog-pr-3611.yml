author: DuLL-FoX
delete-after: true
changes:
  - balance: Обычная фауна снова медленнее бегущего игрока и полностью оплачивает
      диагональное движение.
  - bugfix: Сайдстеп и перестроение стрелка больше не дают бесплатный рывок, а пристёгнутые
      мобы не двигаются вместе со стулом.
  - bugfix: Уворот снова учитывает dodge_prob, а нулевой и небольшой дружественный
      урон не заставляет моба атаковать союзника.
  - rscadd: ИИ прекращает слишком долгую погоню, сохраняет настороженность и продолжает
      искать скрывшуюся за углом цель.
  - rscadd: Милишники учитывают укрытие от конкретного снаряда, подходят перебежками
      и осаждают преграду рядом с видимой целью.
  - rscadd: Дальники обходят строй союзников, доводят выбранный фланг, расходятся
      по позициям и сближаются, если огневой позиции нет.
  - bugfix: Зажатый кайтер умеет выйти вдоль стены или прорваться, а короткая потеря
      видимости больше не позволяет бесплатно сбросить бой.
  - bugfix: Непробиваемая цель временно исключается из повторного выбора, и моб отходит
      от неё вместо стойки вплотную.
  - rscadd: У каждой особи появился характер и собственная фоновая рутина.
  - balance: Боевой дрон стреляет очередью из двух выстрелов вместо трёх, с большим
      откатом и заметным телеграфом.
  - code_imp: TESTING-сборки получили журнал решений ai_trace.log для разбора зависаний
      и неудачных планов ИИ.
