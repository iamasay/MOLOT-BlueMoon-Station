author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Остановка времени слаймом сепии больше не замораживает сервер на секунду.
  - bugfix: Лежащий ядерный диск больше не повышает шанс случайных событий, только
      прилёт оперативника или защитника диска.
  - bugfix: Полоса прогресса на исчезнувший предмет больше не сыплет ошибками.
  - code_imp: Значки медицинского, охранного и диагностического худа выдаются только
      для своего уровня, призракам заметно меньше нагрузки на отрисовку.
  - code_imp: Окно настройки персонажа не перечитывает сейвфайл на каждый клик.
  - code_imp: Музыкальные автоматы не шлют слушателю повторные обновления звука.
  - bugfix: Полоса прогресса у действий без цели теперь видна над персонажем, вылезание
      из вентиляции больше не сыплет ошибками
