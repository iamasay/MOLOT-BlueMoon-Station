changes:
  - balance: VTEC модуль киборгов был ревертнут в вопросе таймера и стал OFF/ON модулем.
      Утерял средний режим работы. Киборги медленнее органиков, с VTEC будут сильно
      быстрее. VTEC все ещё потребляет много энергии за использование в режиме ON.
  - config: Значения замедления киборгов и ускорения VTEC вынесены в конфиг-файл и
      могут быть изменены администрацией по ходу раунда.
