author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Униформа New Mecca корректно отображается у дигитиградных персонажей;
      отключён неподдерживаемый приспущенный вариант.
  - rscadd: Униформа New Mecca добавлена в лодаут.
  - bugfix: Описание ДНК-лока меха больше не дублируется и исчезает после сброса или
      применения emag.
  - bugfix: Арбалеты больше не теряют болты при разрядке и сохраняют запасные боеприпасы
      после выстрела.
  - bugfix: Турели без кожуха больше не становятся невидимыми после отключения и повторного
      закрепления.
  - bugfix: Новые цели кражи выдаются только при наличии подходящего предмета на станции;
      запасы ЦК и руин не учитываются.
  - qol: Жареный арахис теперь даёт пасту при измельчении; прежний способ через отжим
      сохранён.
  - qol: Добавлены пояснения к Rodstopper, болтам Nitrium, помаде Kiss of Mute и ограничениям
      сообщений на PDA мима.
