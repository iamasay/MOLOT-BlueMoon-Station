author: DuLL-FoX
delete-after: true
changes:
  - bugfix: разрастание вейдов не обходит весь радиус за один тик и не бросает дальний
      край под нагрузкой
  - bugfix: слияние атмосферных excited-групп после взрывов больше не квадратично
  - bugfix: прерванный брейкдаун excited-группы не теряет турфы из членства
  - bugfix: замена турфа при освобождении резерваций не оставляет атмосферную группу
      со ссылкой на подменённый турф
  - bugfix: комната забытого корабля разбирается на этапе маппинга и отпускает разбор
      даже при провале размещения
  - code_imp: кеш моделей карты обслуживает оба режима ChangeTurf одним экземпляром
  - code_imp: синхронная часть загрузки шаблонов карт попадает в отчёт SStick_spikes
