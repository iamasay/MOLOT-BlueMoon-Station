author: Silver-Paws
delete-after: true
changes:
  - rscadd: Сумка Bag of Holding, сделанная из ядра с прочностью 80% и ниже, не создаст
      блюспейс-аномалию.
  - rscadd: Компрессор ядер исправно работает, получил замену капа радиуса на ступечнатое
      временное повышение после использования (Перегрев) и требует энергию для использования.
  - balance: Аномалии дропают сырые версии ядер, если обезврежены сигналом.
  - image: Добавлен спрайт нейтрализатора аномалий с ТГ.
  - spellcheck: Перевод строк нейтрализатора аномалий.
  - spellcheck: Перевод строк аномальных ядер.
  - rscdel: Удалены рецепты Bag of Holding из крафт-меню, оставляя только крафт кликом
      ядра по инертной сумке.
  - code_imp: Удален .dm файл рецептов из папки-модуля Феньямомоты. Добавлен .dm файл
      в корень билда для Bag of Holding.
  - code_imp: Код взрывов в вопросе эффекта звука разделён на хелперские проки, которые
      могут проигрываться глобально. Взрывы силой минимум как бомба Клана Паука должны
      проигрывать звук скрипа конструкции станции.
  - code_imp: Аномалии при нейтрализации больше не будут создавать ложный стактрейс,
      если значение их ядра не null, но не является объектом-ядром.
