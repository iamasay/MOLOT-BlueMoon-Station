author: DuLL-FoX
delete-after: true
changes:
  - code_imp: Снос света отложенных z-уровней идёт только под давлением памяти (>=
      80% потолка), с паузой между сносами и по цене подъёма уровня.
  - tweak: 'На одном турфе теперь не больше шести клинаблов: лишние поглощаются или
      вытесняются с переносом улик; рисунки игроков, декали карты и функциональные
      клинаблы не вытесняются.'
  - code_imp: Настройки из панели пишут в savefile только изменённый ключ, буфер сбрасывается
      перед ребутом.
  - code_imp: Фото записей экипажа снимаются при первом открытии карточки, не больше
      двух одновременно.
  - bugfix: Латеджойн-фото в манифесте снова с очками квирков и коляской.
  - code_imp: Спрайтшит вендоматов собирается по типам, товары с варэдитов карт добираются
      автоматически.
  - code_imp: Запрос dpi клиента ушёл с пути входа; панель чата дожидается масштаба
      окна.
  - bugfix: Моб вне мира больше не роняет рантайм каждые две секунды, если горел.
  - code_imp: Покрытие противометеоритного щита кэшируется.
  - tweak: Короткоживущая пена выдаёт химию турфу дозой раз в несколько тиков, суммарная
      доза та же, остаток доливается при любой смерти пены.
  - code_imp: Фолбэк-A* через преграды запускается только когда JPS честно исчерпал
      поиск.
  - bugfix: Форсаж ножных приводов Gygax включается с первого нажатия и выключается
      со второго; щит Дюранда по ПКМ на кнопке больше не переключается молча.
  - bugfix: Стационарный джукбокс снова слышен по всему уровню через реверберацию;
      порог прямого звука остался только у личной шкатулки.
  - bugfix: Отзыв питомца в капсулу отпускает всех, кто был у него внутри, и больше
      не выбрасывает съеденного игрока из игры.
  - bugfix: Null в списках мобов после жёсткого удаления больше не роняет рантаймы
      каждые две секунды до конца раунда.
  - code_imp: Уровень с бесполезным сносом света исключается из сносов и под критическим
      давлением памяти.
  - bugfix: Спрайты снарядов вернулись в спрайтшит спавн-панели; CI проверяет формат
      метадаты DMI.
  - bugfix: Смешение цвета жидкости не делит на ноль при нулевом объёме реагента.
  - bugfix: 'Переход из лобби в игру больше не замораживает сервер на девять секунд:
      лидерборд метадолларов пересобирается в фоне.'
  - code_imp: Мессенджер ПДА отдаёт эмодзи, рингтоны и список абонентов как статику,
      список абонентов общий для всех окон.
  - code_imp: Радио при уничтожении снимается только со своих частот.
  - bugfix: Спрайты fluff-головных уборов снова читаются сборщиком спрайтшитов.
  - admin: 'VV принимает картинки только в .dmi: загруженный GIF в иконке мог ронять
      сервер.'
  - code_imp: Клиент без зажатых клавиш не гоняет обработку ввода каждый тик.
  - code_imp: Аура лечения ищет цели через грид и не зовёт view() впустую.
  - code_imp: Навигационная консоль шаттла обновляет только изменившиеся клетки посадки.
  - code_imp: Листание категорий лодаута не переписывает savefile.
  - code_imp: Сборщик спрайтшитов отдаёт кэш иконок rust после каждого шарда и не
      начинает сборку, пока деплой ещё копирует дерево DMI.
  - code_imp: Свет отложенного z-уровня поднимают и держат только живые игроки и госты
      с включённой темнотой.
  - code_imp: Снос света не выбрасывает кэш отложенных z и паркует источники без квадратичного
      дедупа.
  - bugfix: Генетическая паутина дезориентирует застрявшего вместо рантайма.
  - bugfix: Броня hank возвращает флаги блока, удар по владельцу больше не роняет
      рантайм.
  - bugfix: Перемещение предмета с осиротевшим источником света не роняет рантайм.
  - bugfix: Vore-панель не роняет рантайм у хозяина без клиента.
  - bugfix: Дым падающего пода снимается со списка зоны посадки и не уходит в жёсткое
      удаление.
  - code_imp: Перенос старых балансов метадолларов из preferences.sav идёт в фоне
      при старте раунда, а не девять секунд в инициализации сервера.
  - bugfix: Читалка старого баланса метадолларов из preferences.sav отдавала ноль;
      давно не заходившие игроки снова попадают в лидерборд со своим балансом и без
      слэша в имени.
  - bugfix: Труба, которую атмос-машина не считает соседом, больше не тащит эту машину
      в свою сеть без газовой смеси.
  - code_imp: Гост при орбите и смене вида не пересобирает свой HUD, экран восстанавливается
      только после наблюдения за чужим мобом.
