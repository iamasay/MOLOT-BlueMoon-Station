author: DuLL-FoX
delete-after: true
changes:
  - balance: событие Floor Cluwne больше не выпадает в Extended - только в динамик-раундах,
      а в Dynamic Light стало крайне редким
  - balance: кровные братья стали дешевле для директора (cost/scaling 15 -> 6, intensity
      15 -> 10)
  - balance: мидраунд-еретик (Heretic Awakening) стал дешевле для директора (cost
      10 -> 6, intensity 15 -> 8)
  - balance: латеджойн-еретик (Heretic Smuggler) выравнен с мидраунд-еретиком (cost
      10 -> 6, intensity 15 -> 8)
  - balance: дьявол стал дешевле для директора (cost 10 -> 6, intensity 15 -> 8),
      но реже становится целью гост-пула (вес 6 -> 4)
  - balance: 'гост-пул директора разнообразнее: ревенант и кошмар открываются с 20-й
      минуты, пираты с 30-й вместо 45-й, веса завсегдатаев (морф, метеор, разумная
      болезнь) прижаты, кошмар не чаще раза за раунд'
  - balance: 'тяжёлые гост-команды достижимы на реальном онлайне: блоб и ксены с 30
      попа, террор с 35, окна сдвинуты на 45-ю/25-ю минуту, intensity улья 45 -> 30'
