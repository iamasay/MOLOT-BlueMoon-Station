author: Herobrine998
delete-after: true
changes:
  - rscadd: Портирован и доработан TGUI мехов
  - rscadd: Написан отдельный TGUI для панельки обслуживания мехов
  - rscadd: В мехе теперь можно задать оружие/модуль на ЛКМ и ПКМ через меню или ЛКМ/ПКМ
      по кнопкам-умениям
  - rscadd: Активные модули меха  можно менять на колесико мышки для ЛКМ и на шифт
      + колесико для ПКМ
  - rscadd: Емаг позволяет ставить на мех любые модули
  - qol: Панель обслуживания можно открыть на ALT снаружи меха
  - qol: Все активные модули меха будут выводиться как отдельные кнопки
  - bugfix: Шифт клик в мехе теперь тоже работает, не заставляя стрелять оружие
  - qol: В панели при наведении на повреждение меха, будут инструкции к починке
  - bugfix: Поправлено, что звуки инструментов при работе с панелью не воспроизводились
  - qol: Добавлены контекстные подсказки к меху
  - rscdel: Удалена кнопка сменить модуль за ненадобностью
  - rscadd: У мед. мехов расширены слоты до 4х и добавлен новый модуль, спасательная
      клешня. Она может вскрывать запертые двери как челюсти и затаскивать в слипер
      (если он есть в мехе) персонажей. Работает автоматически при натыкании на дверь,
      даже в правом слоте
