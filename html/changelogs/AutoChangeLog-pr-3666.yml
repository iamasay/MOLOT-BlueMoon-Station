author: Pe4henika
delete-after: true
changes:
  - rscadd: 'Полноценная система жидкостей на тайлах (Портирование с NovaSector):
      реагенты и жидкости на полу текут по соседним тайлам, смешиваются, смещаются
      и испаряются'
  - rscadd: 'Несколько уровней глубины жидкости: лужа, по щиколотку, по пояс, по плечи
      и полностью с головой. Каждый уровень имеет свою скорость, погружение и визуал'
  - rscadd: Швабра (mop) теперь впитывает жидкость с пола, а большинство ёмкостей
      с реагентами (стаканы, канистры и т.п.) могут зачерпнуть жидкость из лужи
  - rscadd: 'Переносной жидкостный насос (portable liquid pump): откачивает или выбрасывает
      жидкость, требуется закрепление на полу, имеет внутреннюю ёмкость'
  - rscadd: 'Подпольные насосы-трубопроводы (floor pump input/output): перекачивают
      жидкость в plumbing-сеть и обратно, с регулятором уровня высоты и автоматической
      доливкой бассейнов'
  - rscadd: При ходьбе по жидкости персонаж замедляется (эффект water_affected), скорость
      зависит от глубины
  - rscadd: 'Подводное дыхание: без черты персонаж задерживает дыхание, а при нехватке
      кислорода начинает захлёбываться и заглатывать жидкость; с чертой TRAIT_WATER_BREATHING
      - спокойно дышит под водой'
  - rscadd: 'Температура жидкости влияет на температуру тела: при погружении организм
      охлаждается/нагревается от жидкости'
  - rscadd: Горючие жидкости на полу (алкоголь, топливо, термоит, напалм и др.) могут
      воспламеняться и гореть, пока хватает реагентов и кислорода
  - rscadd: При падении в воду производится сплеск, персонаж может поскользнуться,
      а при падении в воду выше пояса падение смягчается (сбивание с ног вместо урона)
  - rscadd: Эмоут *water для черты «Водный аспект» - одним движением руки создаётся
      лужа чистой воды
  - rscadd: Новый родовой квирк «Водный аспект (Эмоуты)» и черта TRAIT_WATER_ASPECT
  - rscadd: Персонажи с чертой Messy при оргазме оставляют настоящую растекающуюся
      лужу на полу
  - rscadd: Реагент Drying Agent теперь действительно убирает жидкость с тайла, а
      не только высушивает поверхность
  - rscadd: Админ-вербы «Spawn Liquid» и «Remove liquids (радиус)» для создания и
      удаления жидкостей
  - rscadd: 'Дебаг-инструменты: подсветка групп жидкостей цветом для отладки (toggle_liquid_debug)'
  - rscdel: Удаление блох с кэткринов
  - rscadd: Продвинутая швабра мгновенно убирает жидкости с тайла
  - rscdel: Старые бассейны и их атрибуты со всех карт, как и в целом механика
  - rscadd: Новая система бассейнов, требования забираться и аккуратно спускаться
      в пустые бассейны, получение урона от падения в бассейн
  - rscadd: Новая система плавания, находясь в достаточном количестве воды, вы хуже
      восстанавливаете стамину. Находясь лёжа по голову в воде - вы задыхаетесь
  - rscadd: Добавлен 20% шанс сломать череп при прыжке в пустой бассейн
  - rscadd: Чистоботы теперь справляются с лужами
  - rscadd: Space Cleaner чистит жидкости, но намного хуже чем Drying Agent
  - bugfix: Бесконечный источник спермы
  - bugfix: Жидкости нормально тушатся через огнетушитель и прочее
