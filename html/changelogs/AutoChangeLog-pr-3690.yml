author: DuLL-FoX
delete-after: true
changes:
  - server: 'В перф-лог добавлены колонки памяти процесса: VmSize, VmRSS, пики обоих,
      куча, резидентная память по происхождению, потолок адресного пространства, скорость
      роста, память хоста, отказы аллокации иконок и пересборки колеса таймеров.'
  - server: 'Каждый раунд пишет перепись мира: инстансы по типам с приростом, ширина
      типов, элементы личных, общих на тип и глобальных списков, движимое по z-уровням,
      не-атомные датумы, граф освещения.'
  - server: Состояние мастер-контроллера пишется на диск каждый проход петли. Если
      процесс умер молча, снимок переживает смерть и уезжает в лог следующего раунда
      и в сообщение о крахе.
  - server: 'Подключение клиента пишет в лог свою цену: VmSize до и после client/New(),
      длительность по этапам и контрольный замер через минуту.'
  - server: 'Провал сборки иконки больше не обрывает раунд: пустая иконка, строка
      в лог, сообщение админам и счётчик в перф-логе.'
  - server: Заставка и картинки лобби тяжелее 4 МБ пропускаются, отсечённые файлы
      называются в логе по имени и весу.
  - server: 'Нечитаемый в момент деплоя DMI больше не заставляет пересобирать спрайтшит
      панели спавна: лист ждёт и перепроверяет кэш, а собранный с непрочитанными иконками
      кэш не пишет.'
  - config: Новые записи MEMORY_PRESSURE_EVAC и MEMORY_PRESSURE_EVAC_LEAD_MINUTES.
  - admin: turf_flags и lighting_flags в пикере VV показываются чекбоксами, а не голым
      числом.
  - rscadd: 'Раунд под давлением памяти заканчивается штатно: на 93% потолка адресного
      пространства вызывается шаттл без права отзыва, на остатке в 100 МБ раунд завершается
      принудительно. Раньше процесс на этом месте просто исчезал, раунд в базе оставался
      незакрытым, а игроки получали разрыв вместо экрана итогов.'
  - code_imp: 'Одиннадцать булевых переменных турфа свёрнуты в turf_flags и lighting_flags,
      с /atom снято шесть переменных, которых у турфа не бывает, а четыре угла диагонального
      сглаживания собраны в ленивый список: минус 17 слотов с каждого из 1.2 млн турфов
      мира.'
  - code_imp: Общие списки вместо личных копий у объектов освещения, минеральных турфов,
      синдикатского винтеркоута, шаблонов шаттлов, книги рецептов химдиспенсера и
      карты иконок панели спавна.
  - code_imp: Свет откладывается не только шахтам и резервациям, но и эвей-миссиям
      с VR. Фоновая сборка света больше не отменяет отсрочку и не строит свет z-уровням,
      на которых никого нет, а уровень, пустующий пятнадцать минут, разбирается обратно
      в отложку.
  - code_imp: 'Звуковые датумы не строятся впустую: playsound() без слушателей выходит
      до выделения канала, громкость и остановка канала переведены на статический
      датум, сердце, животы и догборг-слипер больше не собирают /sound на каждый проход.'
  - code_imp: Фон лобби не отправляется клиенту повторно, если он уже лежит в кэше
      скина.
  - code_imp: Колесо таймеров запоминает позицию в бакете при вставке вместо скана
      по 1200 слотам, промотывает пустые бакеты вместо шага на один за проход и не
      собирает отладочное имя таймера на каждый addtimer.
  - code_imp: Экраны хранилищ переиспользуются из общего пула с потолком вместо пула
      у каждой сумки.
  - rscdel: Космических руин пять уровней вместо семи. Каждый уровень занимает 255x255
      турфов независимо от того, сколько руин на нём встало.
  - bugfix: 'Углы освещения снова собираются: Destroy() на любой qdel выдавал stack_trace
      и оставлял датум жить, поэтому осиротевшие углы копились весь раунд по 364 штуки
      в минуту.'
  - bugfix: Источник света отпускает буфер углов после прохода, снесённые углы больше
      не уходят в hard delete по 188 мс.
  - bugfix: Клиент без моба больше не роняет рантайм в change_view. Упавший /client/New()
      BYOND трактует как отказ и рвёт соединение, локально на MetaStation это происходило
      на каждом входе с DreamSeeker.
  - bugfix: 'SSliquids больше не заклинивает на весь раунд: qdel(liquids) без force
      ничего не делал, турф оставался в очереди испарения без жидкости и ронял рантайм
      прямо в fire(), после чего стадии турфов, групп и иммутаблов переставали выполняться.'
  - bugfix: Курсор рунчата не уводит проход в чужой бакет. Остаток текущего слота
      выбрасывался без end_of_life(), то есть сообщения оставались в client.images
      навсегда.
  - bugfix: qdel моба с force больше не роняет ui_hide() экранов хранилища.
  - bugfix: Загрузка персонажа не заводит второй датум вида того же типа.
  - bugfix: Химдым, пена и прочие временные держатели реагентов убирают себя сами.
      Голый /obj-chemholder со своим /datum/reagents образует ссылочный цикл и без
      qdel живёт до конца раунда.
  - bugfix: Медицинский луч не оставляет болванку проверки линии на турфе стрелка.
  - bugfix: 'Убраны сироты экранных объектов HUD: плейн-мастеры с одинаковым номером
      плоскости вытесняли друг друга и жили вечно, click_catcher не удалялся с клиентом,
      нейроинтерфейс без клиента копил экранные объекты по штуке в секунду, старые
      слоты рук и заставки server_hop не убирал никто.'
  - bugfix: Шляпа, падающая в дыру мульти-Z, больше не роняет рантайм.
  - bugfix: 'Шаттлы снова заезжают на станцию: границы шаблона брались из уже отпущенной
      карты.'
  - bugfix: Вернулись типы многотайловых блестдверей, на которых стоят тринадцать
      дверей icemoonstation.
  - bugfix: Реестры мобов по z-уровням больше не читаются за границей списка. Один
      такой рантайм в playsound() на инициализации мира валил прогон тестов на каждой
      карте.
  - map: Окно у эвакуационного шлюза Бокса перестало стоять на космическом турфе в
      станционной зоне.
  - map: На месте снесённого дренажа бассейна теперь трап пола.
