  - rscadd: Добавлены механики раскрытия после ЭМИ, заваривания и ДНК-блокировки MODsuit'ов.
  - rscadd: В ПАКТ-аплинк добавлено улучшение модулей хранения, а улучшенный джетпак
      перенесён в позднюю ветку исследований.
  - qol: Для BlueShield добавлен маячок выбора между MODsuit'ом и хардсьютом.
  - balance: Скорректирована вместимость модулей хранения MODsuit'ов, а стоимость
      MODsuit'а инфильтратора снижена с 12 до 8.
  - image: Добавлены спрайты BlueShield MODsuit в стиле BlackSec и кеткринский рескин
      MODsuit'а.
