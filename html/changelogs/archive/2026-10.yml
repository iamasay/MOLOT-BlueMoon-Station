2026-10-01:
  DuLL-FoX:
  - rscadd: 'Добавлены двенадцать путей еретика: Клинок, Луна, Космос, Замок, Пучина,
      Стекло, Кровь, Эхо, Песок, Воск, Дух и Пляска.'
  - balance: Переработаны Пепел, Ржавчина, Плоть и Пустота, развитие, боевые ресурсы,
      реликвии и вознесения всех путей.
  - rscadd: У путей появились врождённые черты, дела на станции, подготовка мест охоты,
      собственные захваты и способы отхода.
  - rscadd: Пляска объединяет пять танцев, Такт, фигуры шагов, заражение мелодией,
      Маскарад и вознесение Болеро.
  - rscadd: Изнанка позволяет увести цель охоты в карманную комнату; экипаж и сама
      жертва могут разорвать выход и сорвать похищение.
  - rscadd: Живые жертвы проходят Дом памяти с тремя осколками, тенями, ловушками
      и правилами пути; после испытания возвращаются на станцию.
  - balance: Живое подношение даёт 2 очка знаний и 1 побочное, мёртвое — 1 очко; тело
      мёртвой жертвы возвращается в коридор для возможной реанимации.
  - balance: Вознесение требует трёх назначенных душ и трёх трупов экипажа, предупреждает
      станцию и открывает окно для срыва обряда.
  - qol: 'Переработан Кодекс Рубцов: главы, поиск, рецепты с результатом обряда, подготовка,
      помощь новичкам, горячие клавиши и настройки оформления.'
  - rscadd: Добавлен общий тренировочный полигон с учебными ролями, всеми путями еретика,
      уроком Пляски, противниками, снаряжением и контрмерами.
  - rscadd: Добавлены жетон еретика в метамагазине и кристаллы завесы из нейтрализованных
      следов разломов.
  - balance: Наручники, смирительная рубашка и щит разума подавляют магию еретика;
      у щита есть исключения для вознесения и отдельного знания.
  - image: Обновлены облачения, клинки, реликвии, медальоны, книги, руны, призывы,
      Мансус и нимбы шестнадцати путей.
  - sound: Добавлено звуковое оформление путей, захватов, книг, Мансуса и вознесений,
      музыка и ритмические эффекты Пляски.
  - bugfix: Исправлены проверки антимагии, удержание и спасение жертв, управление
      способностями и очистка временных эффектов.
  - rscadd: 'У личной музыкальной шкатулки появилась библиотека: залитые за раунд
      треки можно снова выбрать без новой загрузки.'
  - qol: 'Личная музыкальная шкатулка: до 10 загрузок за раунд, пауза между загрузками
      1 минута.'
  - server: Загруженные в личную шкатулку треки больше не сохраняются в логах раунда.
  - bugfix: Переносную колонку и шкатулку в руках нормально слышно соседям, а не только
      эхом.
  - bugfix: Джукбоксы больше не замирают из-за одной колонки вне карты.
  - bugfix: Очередь джукбокса бара без доступа не изменить; перемещение трека с дублями
      двигает нужный трек.
  - bugfix: Музыка джукбоксов тише при низком давлении.
  - bugfix: Громкость 0 в шкатулке больше не показывается как 100, неудачная загрузка
      не сбрасывает текущий трек.
  - bugfix: Случайный трек от Bath Salts больше не играет тем, кто выключил звук джукбоксов.
