author: DuLL-FoX
delete-after: true
changes:
  - bugfix: обобщённое горение больше не греет смесь само по себе - экзотические газы
      перестают появляться на станции из ниоткуда
  - bugfix: метан, аммиак, метилбромид и BZ горят с выделением тепла, а не с поглощением
  - bugfix: ступени турбины, фаны, плазменное стекло и корпусное остекление держат
      тепло, а не только воздух
  - bugfix: пожарная тревога зоны больше не поднимается от одиночного перепада давления
      - створки по-прежнему захлопываются мгновенно
  - bugfix: аварийная откачка выключается, когда отсек стравлен; режим затопления
      доводит давление до потолка вентов и останавливается
  - bugfix: горение почти пустой смеси больше не роняет обработку воздуха
  - tweak: в осмотре окна написано, проводит оно тепло или нет
  - code_imp: газ-лист обходится один раз за цикл, редукции считаются нативно, реакции-кандидаты
      отсекаются по порогу требований
  - admin: стенд атмоса умеет постоянную нагрузку и честное чередующееся A/B
